<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>天枢 · 手机</title>
<style>
  :root { --bg:#07090f; --card:#12151d; --line:#1e2430; --text:#e6ebf5; --dim:#8b96a8; --cyan:#22d3ee; --blue:#5b8cff; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:14px 14px 40px; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .hd { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .orb { width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#5b8cff,#22d3ee 60%,#0b1020);
    box-shadow:0 0 18px rgba(34,211,238,.45); display:flex; align-items:center; justify-content:center;
    font:600 13px/1 ui-monospace,monospace; color:#04121a; }
  .hd h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.3px; }
  .hd p { margin:2px 0 0; font-size:12px; color:var(--dim); }
  .hd .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; margin-left:auto; box-shadow:0 0 8px #22c55e; }
  h2 { font-size:12px; color:var(--dim); font-weight:600; letter-spacing:.12em; margin:20px 0 8px; }
  h2 b { color:var(--cyan); font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; }
  .card .t { font-weight:600; font-size:14px; }
  .card .m { color:var(--dim); font-size:12px; margin-top:4px; }
  .card .f { color:var(--dim); font-size:12px; margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card.soon { border-color:rgba(239,68,68,.5); }
  .card.now { border-color:rgba(245,158,11,.5); }
  .pill { display:inline-block; font-size:11px; padding:1px 6px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  .row { display:flex; align-items:baseline; gap:8px; }
  .row .k { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .v { color:var(--dim); font-size:12px; white-space:nowrap; }
  .sbox { display:flex; gap:8px; }
  input { flex:1; min-width:0; background:#0d1119; border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:11px 12px; font-size:15px; outline:none; }
  input:focus { border-color:rgba(34,211,238,.6); }
  .hit { padding:10px 0; border-bottom:1px solid var(--line); }
  .hit .h { font-size:14px; font-weight:600; }
  .hit .s { font-size:12px; color:var(--dim); margin-top:4px; }
  .empty { color:var(--dim); font-size:13px; padding:8px 0; }
  .foot { margin-top:26px; color:#5b6678; font-size:11px; text-align:center; }
  .tip { background:rgba(91,140,255,.1); border:1px solid rgba(91,140,255,.35); color:#b9c9ff;
    border-radius:10px; padding:10px 12px; font-size:12.5px; }
</style>
</head>
<body>
<div class="hd">
  <div class="orb">AI</div>
  <div><h1>天枢</h1><p id="sub">正在连接…</p></div>
  <span class="dot" id="dot"></span>
</div>
<div id="needToken" class="tip" style="display:none">
  需要在网址后面带上访问码：<br><code id="tokenHint">http://192.168.0.204:7311/m?t=你的token</code>
</div>
<main id="main" style="display:none">
  <h2>要做的事 <b id="n-due">0</b></h2>
  <div id="due"></div>
  <h2>本周 <b id="n-week">0</b></h2>
  <div id="week"></div>
  <h2>近三天进库 <b id="n-fresh">0</b></h2>
  <div id="fresh"></div>
  <h2>找东西</h2>
  <div class="sbox"><input id="q" placeholder="雅思 / 可行性研究 / 线性回归 …" enterkeyhint="search"></div>
  <div id="hits"></div>
</main>
<div class="foot">本机资料 · 数据不出你的电脑</div>
<script>
(function () {
  var KEY = 'hubToken';
  var qs = new URLSearchParams(location.search);
  if (qs.get('t')) { try { localStorage.setItem(KEY, qs.get('t')); } catch (e) {} }
  var token = '';
  try { token = localStorage.getItem(KEY) || ''; } catch (e) {}
  function api(p) {
    var u = p + (p.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(token);
    return fetch(u).then(function (r) { if (r.status === 401) throw new Error('401'); return r.json(); });
  }
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function when(h) { if (h == null) return ''; if (h < 0) return '已过期 ' + Math.abs(Math.round(h)) + ' 小时'; if (h < 24) return '还剩 ' + Math.round(h) + ' 小时'; return '还剩 ' + Math.round(h / 24) + ' 天'; }
  function cls(h) { if (h == null) return ''; if (h < 0) return 'soon'; if (h < 12) return 'soon'; if (h < 48) return 'now'; return ''; }
  function greeting() { var h = new Date().getHours(); return h < 6 ? '夜里好' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好'; }

  function load() {
    api('/api/brief').then(function (b) {
      if (!token) { el('needToken').style.display = 'block'; return; }
      el('main').style.display = 'block';
      var d = new Date();
      el('sub').textContent = greeting() + ' · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · 本学期 ' + (b.stats ? b.stats.currentCourses : '?') + ' 门课';
      var due = b.due || [];
      el('n-due').textContent = due.length;
      el('due').innerHTML = due.length ? due.map(function (it) {
        return '<div class="card ' + cls(it.hoursLeft) + '"><div class="row"><div class="t k">' + esc(it.title) + '</div><div class="v">' + when(it.hoursLeft) + '</div></div>' +
          '<div class="m">' + esc(it.course || '') + (it.endTime ? ' · 截止 ' + new Date(it.endTime).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '') + '</div>' +
          (it.files && it.files.length ? '<div class="f">附件：' + esc(it.files.join('、')) + '</div>' : '') + '</div>';
      }).join('') : '<div class="empty">没有快到期的作业</div>';
      var wk = b.week || [];
      el('n-week').textContent = wk.length;
      el('week').innerHTML = wk.length ? wk.map(function (w) {
        return '<div class="card"><div class="row"><div class="t k">' + esc(w.title) + '</div><div class="v">' + esc(w.kind || '') + '</div></div><div class="m">' + esc(w.course || '') + '</div></div>';
      }).join('') : '<div class="empty">本周暂无课程活动</div>';
      var fr = b.fresh || [];
      el('n-fresh').textContent = fr.length;
      el('fresh').innerHTML = (fr.length ? fr.slice(0, 12) : []).map(function (f) {
        return '<div class="card"><div class="row"><div class="t k">' + esc(f.title) + '</div><div class="v">' + esc(f.source || '') + '</div></div></div>';
      }).join('') || '<div class="empty">最近没有新资料</div>';
    }).catch(function (e) {
      if (String(e.message) === '401' || !token) { el('needToken').style.display = 'block'; el('main').style.display = 'none'; }
      else el('sub').textContent = '连不上中枢（电脑上的服务没开？）';
    });
  }

  var timer = null;
  el('q').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(timer);
    if (v.length < 1) { el('hits').innerHTML = ''; return; }
    timer = setTimeout(function () {
      api('/api/search?limit=10&q=' + encodeURIComponent(v)).then(function (r) {
        var items = r.items || [];
        el('hits').innerHTML = items.length ? items.map(function (it) {
          return '<div class="hit"><div class="h">' + esc(it.title) + '</div><div class="s">' + esc((it.snippet || '').slice(0, 120)) + '</div>' +
            '<div class="s"><span class="pill">' + esc(it.source) + '</span> ' + esc(it.kind || '') + '</div></div>';
        }).join('') : '<div class="empty">没有命中</div>';
      }).catch(function () {});
    }, 260);
  });

  load();
  setInterval(load, 5 * 60 * 1000);
})();
</script>
</body>
</html>
